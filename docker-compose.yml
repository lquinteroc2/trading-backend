services:
  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: trading-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://trading:trading@postgres:5432/trading?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@trading.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      TECHNICAL_AGENT_BASE_URL: http://technical-agent-worker:8000
      TECHNICAL_ANALYSIS_MIN_CANDLES: ${TECHNICAL_ANALYSIS_MIN_CANDLES:-200}
      TECHNICAL_ANALYSIS_DEFAULT_LIMIT: ${TECHNICAL_ANALYSIS_DEFAULT_LIMIT:-500}
      TECHNICAL_ANALYSIS_CANDLES_LIMIT: ${TECHNICAL_ANALYSIS_CANDLES_LIMIT:-500}
      TECHNICAL_ANALYSIS_TIMEOUT_MS: ${TECHNICAL_ANALYSIS_TIMEOUT_MS:-8000}
      TECHNICAL_ANALYSIS_QUEUE_CONCURRENCY: ${TECHNICAL_ANALYSIS_QUEUE_CONCURRENCY:-5}
      TECHNICAL_ANALYSIS_QUEUE_DEBOUNCE_MS: ${TECHNICAL_ANALYSIS_QUEUE_DEBOUNCE_MS:-30000}
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      BROKER_PROVIDER: ${BROKER_PROVIDER:-MT5}
      MT5_WORKER_BASE_URL: ${MT5_WORKER_BASE_URL:-http://mt5-worker:8010}
      MT5_DRY_RUN: ${MT5_DRY_RUN:-true}
      MT5_REQUEST_TIMEOUT_MS: ${MT5_REQUEST_TIMEOUT_MS:-10000}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      technical-agent-worker:
        condition: service_started
      mt5-worker:
        condition: service_started

  technical-agent-worker:
    build: ./services/agents
    container_name: trading-technical-agent-worker
    restart: unless-stopped
    environment:
      PYTHON_ENV: ${PYTHON_ENV:-development}
    ports:
      - "8000:8000"

  mt5-worker:
    build: ./services/mt5-worker
    container_name: trading-mt5-worker
    restart: unless-stopped
    environment:
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      MT5_DRY_RUN: ${MT5_DRY_RUN:-true}
      MT5_LOGIN: ${MT5_LOGIN:-}
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      MT5_TERMINAL_PATH: ${MT5_TERMINAL_PATH:-}
      MT5_REQUEST_TIMEOUT_MS: ${MT5_REQUEST_TIMEOUT_MS:-10000}
    ports:
      - "8010:8010"

volumes:
  postgres_data:
